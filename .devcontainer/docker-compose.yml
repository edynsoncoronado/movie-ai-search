services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity          # el contenedor queda vivo para que VS Code se conecte
    volumes:
      - ..:/workspace:cached         # la raíz del repo (la carpeta padre de .devcontainer)
      - venv:/opt/venv               # entorno virtual persistente
      - hf-cache:/root/.cache/huggingface   # modelos de embeddings: se descargan una sola vez
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: movies
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d movies"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  venv:
  hf-cache:
  pgdata:
  qdrant-data: